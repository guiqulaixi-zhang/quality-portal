					'manufacturing_quality': '制造质量',

					'procurement_quality': '采购质量',
					'after_sales_quality': '售后质量'

					setSelectedSystem(categoryPageMap[categoryId]);
					setSidebarOpen(false);
				}

				switch (selectedSystem) {
					case '质量运行总览':

					case '售后质量':
						return <CategoryPage categoryName="售后质量" defaultImagePath="./after_sales.png" />;
